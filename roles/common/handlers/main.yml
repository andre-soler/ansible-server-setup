- name: Reiniciar o chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
  listen: reiniciar chrony

- name: Verificar se é preciso reiniciar
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required
  listen: pacotes atualizados

- name: Reiniciar o servidor
  ansible.builtin.reboot:
    msg: "Reiniciando após a atualização de pacotes"
  when: common_reboot_required.stat.exists
  listen: pacotes atualizados
