- name: Instalar o chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Permitir que o chrony corrija o relógio em saltos a qualquer momento
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/makestep.conf
    content: "makestep 1 -1\n"
    owner: root
    group: root
    mode: "0644"
  notify: reiniciar chrony

- name: Garantir que a sincronização de horário está ativa
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Aplicar agora a configuração do chrony
  ansible.builtin.meta: flush_handlers

- name: Aguardar a sincronização do relógio
  ansible.builtin.command: chronyc waitsync 30 1
  changed_when: false
  check_mode: false

- name: Atualizar o cache do apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Instalar pacotes básicos para o Ansible
  ansible.builtin.apt:
    name:
      - acl
    state: present

- name: Atualizar todos os pacotes
  ansible.builtin.apt:
    upgrade: dist
  notify: pacotes atualizados

- name: Criar o usuário de deploy
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Permitir sudo sem senha para o usuário de deploy
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ common_deploy_user }}"
    content: "{{ common_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Autorizar a chave SSH do usuário de deploy
  ansible.posix.authorized_key:
    user: "{{ common_deploy_user }}"
    key: "{{ common_deploy_public_key }}"
    state: present
