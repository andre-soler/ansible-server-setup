- name: Configuração básica do servidor
  hosts: lab
  become: true

  vars:
    deploy_user: deploy
    deploy_public_key: "{{ lookup('file', '~/.ssh/ansible_lab.pub') }}"
    ssh_allowed_users:
      - deploy
      - ubuntu

  tasks:
    - name: Atualizar o cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false

    - name: Atualizar todos os pacotes
      ansible.builtin.apt:
        upgrade: dist
      notify: pacotes atualizados
      

    - name: Criar o usuário de deploy
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Permitir sudo sem senha para o usuário de deploy
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Autorizar a chave SSH do usuário de deploy
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        state: present

    - name: Endurecer a configuração do SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          MaxAuthTries 3
          AllowUsers {{ ssh_allowed_users | join(' ') }}
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: reiniciar ssh


  handlers:
    - name: Verificar se é preciso reiniciar
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      listen: pacotes atualizados

    - name: Reiniciar o servidor
      ansible.builtin.reboot:
        msg: "Reiniciando após a atualização de pacotes"
      when: reboot_required.stat.exists
      listen: pacotes atualizados
 
    - name: Reiniciar o SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
      listen: reiniciar ssh
