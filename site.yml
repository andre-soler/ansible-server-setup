- name: Configuração básica do servidor
  hosts: lab
  become: true

  vars:
    deploy_user: deploy
    deploy_public_key: "{{ lookup('file', '~/.ssh/ansible_lab.pub') }}"

  tasks:
    - name: Atualizar o cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Atualizar todos os pacotes
      ansible.builtin.apt:
        upgrade: dist
      notify: pacotes atualizados
      

    - name: Criar o usuário de deploy
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Permitir sudo sem senha para o usuário de deploy
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Autorizar a chave SSH do usuário de deploy
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        state: present
  handlers:
    - name: Verificar se é preciso reiniciar
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      listen: pacotes atualizados

    - name: Reiniciar o servidor
      ansible.builtin.reboot:
        msg: "Reiniciando após a atualização de pacotes"
      when: reboot_required.stat.exists
      listen: pacotes atualizados 
